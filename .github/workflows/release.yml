# Builds Spoco.exe, the Windows installer and the macOS app. Pushing a tag like v1.2.3 publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Spoco.exe
        shell: cmd
        run: build.cmd

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$version" installer\Spoco.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: spoco
          path: |
            Spoco.exe
            dist/SpocoSetup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Spoco.app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export SPOCO_VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh

      - name: Self-test
        run: Spoco.app/Contents/MacOS/Spoco --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: spoco-macos
          path: dist/Spoco-macOS.zip

  release:
    if: github.ref_type == 'tag'
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-pushing an existing tag replaces the release's files instead of failing.
        run: |
          files="dist/SpocoSetup.exe Spoco.exe Spoco-macOS.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --title "Spoco $GITHUB_REF_NAME" --generate-notes
          fi
